name: Publicar MesaChef en github.io
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: mesachef-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Instalar MesaChef si el repositorio está vacío
        env:
          RELEASE_URL: '@RELEASE_URL@'
          RELEASE_SHA256: '@RELEASE_SHA256@'
        run: |
          if [ ! -f site/index.html ] || [ ! -f scripts/validate-site.py ]; then
            curl --fail --location --retry 3 "$RELEASE_URL" --output /tmp/mesachef.zip
            echo "$RELEASE_SHA256  /tmp/mesachef.zip" | sha256sum --check
            python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          target = Path.cwd().resolve()
          with ZipFile('/tmp/mesachef.zip') as archive:
              for item in archive.infolist():
                  assert (target / item.filename).resolve().is_relative_to(target), 'Ruta no válida'
                  if not item.filename.startswith('.github/'):
                      archive.extract(item, target)
          PY
          fi
          python scripts/validate-site.py
          python -m unittest discover -s tests -p '*_test.py'
      - name: Actualizar precios de recetas
        continue-on-error: true
        run: python scripts/refresh-prices.py
      - name: Actualizar catálogos principales
        continue-on-error: true
        run: python scripts/refresh-catalogs.py --retailers mercadona carrefour
      - name: Actualizar primeras páginas públicas de MAS
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: python scripts/refresh-mas.py
      - name: Actualizar categorías públicas de Día
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: python scripts/refresh-dia.py
      - run: python scripts/validate-site.py
      - name: Guardar código y consultas en tu repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site scripts tests package.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar MesaChef y sus consultas con fuente'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
